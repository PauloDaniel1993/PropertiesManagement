name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  restore:
    name: Restore dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore backend dependencies
        run: dotnet restore Alsappan.slnx

      - name: Restore frontend dependencies
        run: npm ci

  backend-format:
    name: Backend format
    runs-on: ubuntu-latest
    needs: restore

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore backend dependencies
        run: dotnet restore Alsappan.slnx

      - name: Verify backend formatting
        run: dotnet format Alsappan.slnx --verify-no-changes --no-restore

  backend-build:
    name: Backend build
    runs-on: ubuntu-latest
    needs: restore

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore backend dependencies
        run: dotnet restore Alsappan.slnx

      - name: Build backend
        run: dotnet build Alsappan.slnx --configuration Release --no-restore

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    needs: restore

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: alsappan
          POSTGRES_USER: alsappan
          POSTGRES_PASSWORD: alsappan_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alsappan -d alsappan"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ALSAPPAN_TEST_POSTGRES: Host=localhost;Port=5432;Database=alsappan;Username=alsappan;Password=alsappan_dev_password

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore backend dependencies
        run: dotnet restore Alsappan.slnx

      - name: Build backend for tests
        run: dotnet build Alsappan.slnx --configuration Release --no-restore

      - name: Run backend tests
        run: dotnet test Alsappan.slnx --configuration Release --no-build

  frontend-format:
    name: Frontend format
    runs-on: ubuntu-latest
    needs: restore

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore frontend dependencies
        run: npm ci

      - name: Verify frontend formatting
        run: npm run format:check --workspace src/Alsappan.Web

  frontend-typecheck-build:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    needs: restore

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore frontend dependencies
        run: npm ci

      - name: Type check frontend
        run: npm run typecheck --workspace src/Alsappan.Web

      - name: Build frontend
        run: npm run build --workspace src/Alsappan.Web

  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    needs: restore

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint --workspace src/Alsappan.Web

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    needs: restore

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test --workspace src/Alsappan.Web

  openapi:
    name: OpenAPI generation
    runs-on: ubuntu-latest
    needs: restore

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore backend dependencies
        run: dotnet restore Alsappan.slnx

      - name: Build API
        run: dotnet build src/Alsappan.Api/Alsappan.Api.csproj --no-restore

      - name: Generate and validate OpenAPI document
        shell: pwsh
        run: ./scripts/validate-openapi.ps1 -NoBuild

  migrations:
    name: EF migration validation
    runs-on: ubuntu-latest
    needs: restore

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install EF tooling
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.9
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore backend dependencies
        run: dotnet restore Alsappan.slnx

      - name: Build backend for migration validation
        run: dotnet build Alsappan.slnx --no-restore

      - name: Validate EF migrations
        shell: pwsh
        run: ./scripts/validate-migrations.ps1 -NoBuild

  openspec:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    needs: restore

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate OpenSpec change
        run: npx --yes openspec validate build-alsappan-property-management-platform --strict
